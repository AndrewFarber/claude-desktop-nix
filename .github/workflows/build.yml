name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by update.yml so new versions are built before they are committed
  # (pushes made with GITHUB_TOKEN don't trigger other workflows).
  workflow_call:
    inputs:
      sources:
        description: Replacement sources.json contents
        type: string
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Apply candidate sources.json
        if: inputs.sources != ''
        env:
          SOURCES: ${{ inputs.sources }}
        run: printf '%s\n' "$SOURCES" >sources.json

      - run: nix flake check --no-build
      - run: nix build -L .#packages.${{ matrix.system }}.default
