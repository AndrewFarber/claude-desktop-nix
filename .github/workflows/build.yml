name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by update.yml and update-lock.yml so candidates are built before
  # they are committed (pushes made with GITHUB_TOKEN don't trigger workflows).
  workflow_call:
    inputs:
      sources:
        description: Replacement sources.json contents
        type: string
        default: ""
      lock:
        description: Replacement flake.lock contents
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop -c just lint

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Apply candidate sources.json
        if: inputs.sources != ''
        env:
          SOURCES: ${{ inputs.sources }}
        run: jq . <<<"$SOURCES" >sources.json

      - name: Apply candidate flake.lock
        if: inputs.lock != ''
        env:
          LOCK: ${{ inputs.lock }}
        run: jq . <<<"$LOCK" >flake.lock

      - run: nix flake check --no-build
      - run: nix build -L .#packages.${{ matrix.system }}.default
