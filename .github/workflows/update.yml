name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with update-lock.yml so the two never push to main at once.
concurrency: update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sources: ${{ steps.check.outputs.sources }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The dev shell provides the script's tools, the same as `just update`.
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Read Anthropic's signed apt index
        id: check
        run: |
          nix develop -c .github/update-sources.sh
          if git diff --quiet sources.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "sources=$(jq -c . sources.json)"
              echo "version=$(jq -r '."x86_64-linux".version' sources.json)"
            } >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      sources: ${{ needs.check.outputs.sources }}

  commit:
    needs: [check, build]
    # Only main's own runs: a dispatch from another branch builds a candidate
    # against that branch, which must not land on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Commit new version
        env:
          SOURCES: ${{ needs.check.outputs.sources }}
          VERSION: ${{ needs.check.outputs.version }}
        # The candidate was built against $GITHUB_SHA. If main has moved since
        # (another update, or a push), that combination was never built, so
        # skip; the next scheduled run rebuilds against the new main.
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "main moved since $GITHUB_SHA was checked; skipping"
            exit 0
          fi
          jq . <<<"$SOURCES" >sources.json
          if git diff --quiet sources.json; then
            echo "main already has these sources; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-desktop: $VERSION"
          git push
