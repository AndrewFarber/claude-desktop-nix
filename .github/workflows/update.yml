name: update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency: update

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      sources: ${{ steps.check.outputs.sources }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read Anthropic's signed apt index
        id: check
        run: |
          .github/update-sources.sh
          if git diff --quiet sources.json; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "sources=$(jq -c . sources.json)"
              echo "version=$(jq -r '."x86_64-linux".version' sources.json)"
            } >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      sources: ${{ needs.check.outputs.sources }}

  commit:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit new version
        env:
          SOURCES: ${{ needs.check.outputs.sources }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          jq . <<<"$SOURCES" >sources.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "claude-desktop: $VERSION"
          git push
